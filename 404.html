<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | OneWayTaxiBihar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      margin: 0;
    }
    .error-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .error-code {
      font-size: 72px;
      font-weight: 900;
      color: #38bdf8;
      line-height: 1;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .error-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-home {
      display: inline-block;
      background: #059669;
      color: white;
      text-decoration: none;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-home:hover {
      background: #047857;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Destination Route Not Found</h1>
    <p class="error-desc">
      The page you are trying to reach doesn't exist or has moved. Don't worry, your outstation cab booking is just a tap away.
    </p>
    <a href="index.html" class="btn-home">← Return to Booking Desk</a>
    <div style="margin-top: 20px; font-size: 12.5px; color: #64748b;">
      Need immediate assistance? Call dispatch: <a href="tel:+918002141816" style="color: #34d399; font-weight: 700; text-decoration: none;">+91 80021 41816</a>
    </div>
  </div>
</body>
</html>
