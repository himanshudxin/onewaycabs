<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Driver Partner Console | OneWayTaxiBihar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    :root {
      --driver-bg: #090d16;
      --driver-card: #131b2e;
      --driver-border: #1e293b;
      --driver-text: #f8fafc;
      --driver-primary: #10b981;
    }
    body.driver-body {
      background: var(--driver-bg);
      color: var(--driver-text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .driver-navbar {
      background: rgba(19, 27, 46, 0.95);
      border-bottom: 1px solid var(--driver-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .driver-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      color: #34d399;
    }
    .driver-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .driver-container {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      flex: 1;
    }
    .driver-login-box {
      background: var(--driver-card);
      border: 1px solid var(--driver-border);
      border-radius: 16px;
      padding: 24px;
      margin-top: 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .driver-trip-card {
      background: var(--driver-card);
      border: 1px solid var(--driver-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    /* Stepper Bar */
    .driver-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      background: #090d16;
      border: 1px solid var(--driver-border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .step-item {
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .step-item.active {
      color: #38bdf8;
    }
    .step-item.completed {
      color: #34d399;
    }

    .driver-step-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-step-accept { background: #0284c7; color: white; }
    .btn-step-way { background: #d97706; color: white; }
    .btn-step-arrived { background: #8b5cf6; color: white; }
    .btn-step-start { background: #059669; color: white; }
    .btn-step-complete { background: #10b981; color: white; }
    .btn-call-customer {
      background: #10b981;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-nav-map {
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .driver-tab-pill {
      background: var(--driver-card);
      border: 1px solid var(--driver-border);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .driver-tab-pill.active {
      background: #059669;
      color: white;
      border-color: #34d399;
    }
  </style>
</head>
<body class="driver-body">

  <!-- Driver Login Screen -->
  <div id="driver-login-view" style="display: none; padding: 16px;">
    <div class="driver-login-box">
      <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 32px; margin-bottom: 6px;">🚖</div>
        <h2 style="font-size: 20px; font-weight: 900; margin: 0; color: #f8fafc;">Partner Driver Portal</h2>
        <p style="font-size: 12.5px; color: #94a3b8; margin-top: 4px;">Log in to access your assigned Bihar outstation trips</p>
      </div>

      <div style="margin-bottom: 14px;">
        <label style="font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">REGISTERED MOBILE NUMBER</label>
        <input type="tel" id="driver-phone-input" placeholder="e.g. 9431012345" maxlength="10" style="width: 100%; box-sizing: border-box; padding: 12px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; color: white; margin-top: 4px; font-size: 15px;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">4-DIGIT SECURITY PIN</label>
        <input type="password" id="driver-pin-input" placeholder="Enter 4-digit PIN" maxlength="4" style="width: 100%; box-sizing: border-box; padding: 12px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; color: white; margin-top: 4px; font-size: 15px;">
      </div>

      <button type="button" onclick="handleDriverLogin()" style="width: 100%; padding: 14px; background: #10b981; color: white; font-weight: 800; border: none; border-radius: 8px; font-size: 15px; cursor: pointer;">
        Log In as Partner Driver →
      </button>

      <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid #1e293b; text-align: center; font-size: 12px; color: #64748b;">
        Demo Verified Partners: <strong>9431012345 (PIN: 1234)</strong> or <strong>9835067890 (PIN: 5678)</strong>
      </div>
      <div style="text-align: center; margin-top: 14px; font-size: 12px;">
        <a href="index.html" style="color: #38bdf8; text-decoration: none;">← Back to Passenger Website</a>
      </div>
    </div>
  </div>

  <!-- Driver Trips Dashboard -->
  <div id="driver-dashboard-view">
    <header class="driver-navbar">
      <div class="driver-brand">
        <span>OneWayTaxiBihar</span>
        <span class="driver-badge">PARTNER</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="driver-name-display" style="font-size: 13px; font-weight: 700; color: #f8fafc;"></span>
        <button type="button" onclick="handleDriverLogout()" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 11.5px; cursor: pointer;">
          Logout
        </button>
      </div>
    </header>

    <main class="driver-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px;">
        <div style="display: flex; gap: 8px;">
          <button type="button" class="driver-tab-pill active" id="btn-tab-active" onclick="switchDriverTab('active')">Active Trips</button>
          <button type="button" class="driver-tab-pill" id="btn-tab-history" onclick="switchDriverTab('history')">Completed History</button>
        </div>
        <button type="button" onclick="loadDriverTrips()" style="background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">
          🔄 Refresh
        </button>
      </div>

      <div id="driver-trips-list">
        <!-- Injected via JS -->
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script>
    let _driverToken = localStorage.getItem("otb_driver_token");
    let _driverProfile = null;
    let _currentTab = "active";
    let _allDriverTrips = [];

    try {
      _driverProfile = JSON.parse(localStorage.getItem("otb_driver_profile") || "null");
    } catch(e) {}

    async function initDriver() {
      if (!_driverToken) {
        document.getElementById("driver-login-view").style.display = "block";
        document.getElementById("driver-dashboard-view").style.display = "none";
        return;
      }

      document.getElementById("driver-login-view").style.display = "none";
      document.getElementById("driver-dashboard-view").style.display = "block";

      if (_driverProfile) {
        document.getElementById("driver-name-display").textContent = `${_driverProfile.name} (${_driverProfile.vehicleNumber})`;
      }

      await loadDriverTrips();
    }

    async function handleDriverLogin() {
      const phone = document.getElementById("driver-phone-input").value.trim();
      const pin = document.getElementById("driver-pin-input").value.trim();

      const res = await ApiClient.driverLogin(phone, pin);
      if (res && res.success && res.token) {
        _driverToken = res.token;
        _driverProfile = res.driver;
        localStorage.setItem("otb_driver_token", _driverToken);
        localStorage.setItem("otb_driver_profile", JSON.stringify(_driverProfile));
        initDriver();
      } else {
        alert(res?.message || "Invalid Driver Mobile or PIN");
      }
    }

    function handleDriverLogout() {
      localStorage.removeItem("otb_driver_token");
      localStorage.removeItem("otb_driver_profile");
      _driverToken = null;
      _driverProfile = null;
      initDriver();
    }

    function switchDriverTab(tab) {
      _currentTab = tab;
      document.getElementById("btn-tab-active").classList.toggle("active", tab === "active");
      document.getElementById("btn-tab-history").classList.toggle("active", tab === "history");
      renderTrips();
    }

    async function loadDriverTrips() {
      const res = await ApiClient.driverGetTrips(_driverToken);
      if (res && res.success && Array.isArray(res.trips)) {
        _allDriverTrips = res.trips;
        renderTrips();
      } else if (res && res.status === 401) {
        handleDriverLogout();
      }
    }

    function renderTrips() {
      const listEl = document.getElementById("driver-trips-list");
      const filtered = _allDriverTrips.filter(t => {
        if (_currentTab === "active") return t.bookingStatus !== "COMPLETED" && t.bookingStatus !== "CANCELLED";
        return t.bookingStatus === "COMPLETED" || t.bookingStatus === "CANCELLED";
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div style="text-align: center; padding: 40px 16px; background: var(--driver-card); border-radius: 14px; border: 1px dashed var(--driver-border);">
            <div style="font-size: 32px; margin-bottom: 8px;">🛣️</div>
            <h4 style="margin: 0 0 6px 0; font-size: 16px; color: #f8fafc;">
              ${_currentTab === 'active' ? 'No active trips assigned' : 'No completed trips in history'}
            </h4>
            <p style="font-size: 13px; color: #94a3b8; margin: 0;">
              ${_currentTab === 'active' ? 'Patna central dispatch will notify you when a new ride is assigned to your vehicle.' : 'Your finished trips will appear here with fare receipts.'}
            </p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(t => {
        const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(t.pickupAddress || t.originCity)}`;
        const isAssigned = t.bookingStatus === "DRIVER ASSIGNED" || t.bookingStatus === "CONFIRMED";
        const isWay = t.bookingStatus === "DRIVER ON THE WAY" || t.bookingStatus === "ON THE WAY";
        const isArrived = t.bookingStatus === "ARRIVED";
        const isStarted = t.bookingStatus === "TRIP STARTED";
        const isCompleted = t.bookingStatus === "COMPLETED";

        // OneWay.Cab status lifecycle action buttons (Req 49, 175)
        let actionBtn = '';
        if (isAssigned) {
          actionBtn = `<button type="button" class="driver-step-btn btn-step-accept" onclick="updateTripStatus('${t.bookingId}', 'DRIVER ON THE WAY', 'Chauffeur accepted and started moving to pickup')">Accept &amp; Depart (On the Way) →</button>`;
        } else if (isWay) {
          actionBtn = `<button type="button" class="driver-step-btn btn-step-arrived" onclick="updateTripStatus('${t.bookingId}', 'ARRIVED', 'Chauffeur arrived at passenger pickup location')">Arrived at Doorstep →</button>`;
        } else if (isArrived) {
          actionBtn = `<button type="button" class="driver-step-btn btn-step-start" onclick="updateTripStatus('${t.bookingId}', 'TRIP STARTED', 'Passenger boarded, journey started')">Start Journey →</button>`;
        } else if (isStarted) {
          actionBtn = `<button type="button" class="driver-step-btn btn-step-complete" onclick="updateTripStatus('${t.bookingId}', 'COMPLETED', 'Passenger safely reached destination')">Complete Journey →</button>`;
        } else {
          actionBtn = `<div style="text-align: center; font-weight: 800; color: #34d399; font-size: 14px; padding: 10px; background: rgba(16, 185, 129, 0.1); border-radius: 8px;">✓ Journey Finished (${t.bookingStatus})</div>`;
        }

        return `
          <div class="driver-trip-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; border-bottom: 1px dashed var(--driver-border); padding-bottom: 10px;">
              <div>
                <span style="font-size: 11px; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 2px 8px; border-radius: 4px; font-family: monospace;">${t.bookingId}</span>
                <h4 style="margin: 6px 0 0 0; font-size: 17px; font-weight: 800; color: #f8fafc;">${t.originCity} ➔ ${t.destCity}</h4>
              </div>
              <div style="text-align: right;">
                <span style="font-size: 18px; font-weight: 900; color: #34d399;">₹${(t.totalFare || 0).toLocaleString('en-IN')}</span>
                <div style="font-size: 11px; color: #94a3b8;">${t.paymentMethod || 'UPI'} • ${t.paymentStatus || 'Pending'}</div>
              </div>
            </div>

            <!-- Stepper Progression Visualizer (Req 49) -->
            <div class="driver-stepper">
              <div class="step-item ${isAssigned ? 'active' : 'completed'}">1. Assigned</div>
              <span>➔</span>
              <div class="step-item ${isWay ? 'active' : (isArrived || isStarted || isCompleted ? 'completed' : '')}">2. On Way</div>
              <span>➔</span>
              <div class="step-item ${isArrived ? 'active' : (isStarted || isCompleted ? 'completed' : '')}">3. Arrived</div>
              <span>➔</span>
              <div class="step-item ${isStarted ? 'active' : (isCompleted ? 'completed' : '')}">4. In Trip</div>
              <span>➔</span>
              <div class="step-item ${isCompleted ? 'completed active' : ''}">5. Done</div>
            </div>

            <!-- Pickup & Drop Details -->
            <div style="font-size: 13px; color: #cbd5e1; line-height: 1.6; margin-bottom: 14px; background: #090d16; padding: 12px; border-radius: 8px; border: 1px solid #1e293b;">
              <div>📍 <strong>Pickup:</strong> ${t.pickupAddress}</div>
              <div>🏁 <strong>Drop:</strong> ${t.dropAddress}</div>
              <div style="margin-top: 4px; color: #94a3b8; font-size: 12px;">⏰ <strong>Schedule:</strong> ${t.pickupDate} at ${t.pickupTime} (~${t.distanceKm} KM)</div>
            </div>

            <!-- Passenger Contact & Navigation (Req 171, 172, 173) -->
            <div style="display: flex; gap: 8px; margin-bottom: 14px;">
              ${isAssigned ? `
                <div style="flex: 1; font-size: 12px; color: #94a3b8; display: flex; align-items: center; justify-content: center; background: #090d16; border-radius: 8px; padding: 8px;">
                  👤 Passenger: <strong>${t.passengerName}</strong> (Contact revealed on accept)
                </div>
              ` : `
                <a href="tel:${t.passengerPhone}" class="btn-call-customer" style="flex: 1; justify-content: center;">
                  📞 Call ${t.passengerName} (${t.passengerPhone})
                </a>
              `}
              <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="btn-nav-map">
                🗺️ Maps
              </a>
            </div>

            <!-- Trip Status Progression Button -->
            <div>${actionBtn}</div>
          </div>
        `;
      }).join("");
    }

    async function updateTripStatus(bookingId, newStatus, note) {
      const res = await ApiClient.driverUpdateStatus(bookingId, newStatus, _driverToken, note);
      if (res && res.success) {
        await loadDriverTrips();
      } else {
        alert(res?.message || "Failed to update status");
      }
    }

    // Initialize on load
    window.addEventListener("DOMContentLoaded", initDriver);
  </script>
</body>
</html>
