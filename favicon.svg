<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="otbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#0047a5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0070f3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="#090d16" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#otbGrad)" stroke-width="2" opacity="0.6" />

  <!-- Dynamic Highway Curve -->
  <path d="M24 96 C 44 96, 50 48, 88 40" fill="none" stroke="url(#otbGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <path d="M40 96 C 56 96, 62 60, 96 52" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6" opacity="0.8" />

  <!-- Forward Highway Arrow / Car Glyph -->
  <g transform="translate(68, 26)">
    <polygon points="26,16 4,4 10,16 4,28" fill="url(#accentGrad)" />
  </g>

  <!-- Brand Typography Glyph '1' -->
  <text x="32" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">1</text>
  <circle cx="50" cy="34" r="4" fill="url(#accentGrad)" />
</svg>
